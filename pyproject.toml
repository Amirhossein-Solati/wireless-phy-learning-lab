[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-phy-learning-lab"
version = "0.1.0"
description = "A research framework for MIMO detection: classical baselines and model-driven detectors"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Amirhossein Solati" }]
keywords = ["wireless", "mimo", "detection", "physical-layer", "research"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
config = ["pyyaml>=6.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Amirhossein-Solati/wireless-phy-learning-lab"
Repository = "https://github.com/Amirhossein-Solati/wireless-phy-learning-lab"
Documentation = "https://github.com/Amirhossein-Solati/wireless-phy-learning-lab/blob/main/docs/mathematical_model.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.coverage.run]
source = ["wireless_phy_lab"]
branch = true
